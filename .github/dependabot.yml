# Atualizações automáticas de dependências. Cada pull request passa pelo CI.
# Referência: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Pacotes do package.json / package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    # Espera alguns dias depois de uma versão sair: versões com defeito ou
    # comprometidas costumam ser retiradas nesse intervalo.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Os pacotes do Angular sobem juntos, na mesma versão; separados, o npm recusaria a instalação.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major do Angular pede `ng update` (que roda as migrações de código), não só trocar a versão.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  # Versões das actions usadas em .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
